<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CR3BP Transfer Visualizer</title>
    <meta name="author" content="A. Hakobyan" />
    <meta
      name="description"
      content="Exact periodic orbits and impulsive transfer solutions in the Earth-Moon circular restricted three-body problem."
    />
    <!--
      Waning crescent — the sliver that shows in the days before a new moon, lit
      on the left. Two circles and a mask rather than a single even-odd path: the
      shadow circle reaches past the disc on the right, and with even-odd that
      overhang would fill in as a second sliver on the wrong side. The mask clips
      it to the disc and leaves real transparency, so the icon works on a light
      or a dark tab strip.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cmask id='m'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23fff'/%3E%3Ccircle cx='21.5' cy='16' r='12.4' fill='%23000'/%3E%3C/mask%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e8e6dc' mask='url(%23m)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
