name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The acceptance tests run against the committed catalog, so a data or
      # propagator regression fails the deploy rather than shipping.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
        with:
          # Create the Pages site through the API if it does not exist yet.
          # Without this the first run dies with "Get Pages site failed /
          # Not Found", which reads like a permissions problem but only means
          # Pages has never been switched on for the repository.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
